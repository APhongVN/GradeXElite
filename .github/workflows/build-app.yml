name: Build Mac & Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build for macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install pyinstaller pillow requests
    - name: Build Mac .app
      run: |
        pyinstaller --onefile --windowed --name "GradeXElite" \
          --collect-all PIL \
          --hidden-import requests \
          --osx-bundle-identifier "com.gradex.elite" \
          GradeXElite.py
    - name: Copy logo to dist
      run: |
        cp logo_bach_khoa.png dist/ 2>/dev/null || true
    - name: Upload Mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: GradeXElite-Mac
        path: dist/

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow requests
    - name: Build Windows .exe
      run: |
        pyinstaller --onefile --noconsole --name "GradeXElite" --collect-all PIL --hidden-import requests GradeXElite.py
    - name: Copy logo to dist
      run: |
        copy logo_bach_khoa.png dist\
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: GradeXElite-Windows
        path: dist/
